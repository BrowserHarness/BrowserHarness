name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate extension output
        run: |
          test -f apps/extension/dist/manifest.json
          test -f apps/extension/dist/sidepanel.html
          test -f apps/extension/dist/assets/service-worker.js
          test -f apps/extension/dist/assets/content.js
          node -e "JSON.parse(require('fs').readFileSync('apps/extension/dist/manifest.json','utf8'))"

      - name: Package extension
        run: |
          cd apps/extension/dist
          zip -r ../../../browsercrew-extension.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: browsercrew-extension
          path: browsercrew-extension.zip
          if-no-files-found: error
          retention-days: 14
